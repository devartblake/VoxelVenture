# Weekly dependency updates as pull requests (they run CI like any other change).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Pascal packages import each other's internals and break when their versions differ (core 1.0.4 removed exports
      # that nodes 1.0.3 imports), so they are always updated together in one pull request.
      pascal:
        patterns:
          - '@pascal-app/*'
  - package-ecosystem: pip
    directory: /services/messaging
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
